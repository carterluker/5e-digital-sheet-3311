services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sheet
      POSTGRES_PASSWORD: sheet
      POSTGRES_DB: sheet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheet"]
      interval: 5s
      retries: 10

volumes:
  pgdata: